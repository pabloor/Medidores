name: Construir Medidores.app
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'medidores/**', 'medidores-solo/**', 'package.json', '.github/workflows/build-mac.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build:mac
      # Publica los ZIP en una Release (enlace de descarga directa, sin entrar en Actions).
      - name: Publicar release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="mac-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "Medidores.app ($TAG)" \
            --notes "Medidores.app para Mac. Elige Apple-Silicon (M1–M4) o Intel, descomprime y abre «Instalar Medidores.command»."
