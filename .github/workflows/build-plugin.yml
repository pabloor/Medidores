name: Construir plugin Medidores EQ
on:
  workflow_dispatch:
  push:
    paths: ['plugin-au/**', '.github/workflows/build-plugin.yml']
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S plugin-au -B plugin-au/build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Compilar
        run: cmake --build plugin-au/build --config Release --parallel
      - name: Validar el Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "plugin-au/build/MedidoresEQ_artefacts/Release/AU/Medidores EQ.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Meq1 Polv
      - name: Empaquetar
        run: |
          cd plugin-au/build/MedidoresEQ_artefacts/Release
          ditto -c -k --keepParent "AU/Medidores EQ.component" "$GITHUB_WORKSPACE/MedidoresEQ-AU.zip"
          ditto -c -k --keepParent "VST3/Medidores EQ.vst3" "$GITHUB_WORKSPACE/MedidoresEQ-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MedidoresEQ
          path: MedidoresEQ-*.zip
