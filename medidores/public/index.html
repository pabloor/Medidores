<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141925">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Medidores</title>
<style>
  /* Sin fuentes remotas: en un bolo puede no haber internet. */
  :root {
    --font: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
    --stage: #141925;
    --panel: #1c2332;
    --well: #0a0e16;
    --ink: #e7eaf1;
    --muted: #8690a4;
    --line: #2a3243;
    --sig: #37c77c;
    --warm: #f1b43b;
    --hot: #f24a3a;
    --g-ch: #72c2dc;
    --g-bus: #b39af3;
    --g-mtx: #e49fc6;
    --g-fx: #8fd6a8;
    --g-main: #e7eaf1;
    --strip: 34px;
    --head: 26px;
    --clip: 8px;
    --foot: 38px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --stage: #e9ecf2;
    --panel: #ffffff;
    --well: #151a26;
    --ink: #121722;
    --muted: #4f586b;
    --line: #c9cfdb;
    --g-ch: #1d7fa3;
    --g-bus: #6a4fcf;
    --g-mtx: #b0417f;
    --g-fx: #2d8a54;
    --g-main: #121722;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    color: var(--ink);
    font-family: var(--font);
    font-stretch: condensed;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr); /* nada puede ensanchar la página más que la pantalla */
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--g-ch); outline-offset: 2px; }

  /* Barra superior */
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 6px calc(12px + env(safe-area-inset-left, 0px));
    padding-right: calc(10px + env(safe-area-inset-right, 0px));
  }
  .status { display: flex; align-items: center; gap: 8px; min-width: 14px; flex: 1; font-size: 16px; } /* el punto de conexión siempre visible */
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-state="connected"] .dot { background: var(--sig); }
  .status[data-state="searching"] .dot, .status[data-state="connecting"] .dot { background: var(--warm); animation: blink 1s steps(2) infinite; }
  .status[data-state="lost"] .dot, .status[data-state="error"] .dot, .status[data-state="offline"] .dot { background: var(--hot); }
  .status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes blink { 50% { opacity: .25; } }
  .icon-btn {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    width: 38px; height: 34px; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* Tablero */
  .board {
    display: grid;
    grid-template-columns: auto 1fr auto;
    min-height: 0;
    padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  }
  .scale {
    position: relative; width: 30px;
    margin: calc(var(--head) + var(--clip) + 4px) 0 var(--foot);
    font-size: 11px; color: var(--muted);
  }
  .scale span { position: absolute; right: 4px; transform: translateY(50%); font-variant-numeric: tabular-nums; }
  .scroller { overflow-x: auto; overflow-y: hidden; display: flex; gap: 14px; padding-right: 10px; scroll-snap-type: x proximity; }
  .pinned[hidden] { display: none; }
  .pinned { display: flex; padding: 0 10px 0 12px; border-left: 1px solid var(--line); background: var(--stage); }
  .group { display: flex; flex-direction: column; scroll-snap-align: start; }
  .group[hidden] { display: none; }
  .group-head {
    height: var(--head); font-size: 14px; font-weight: 600; color: var(--gc);
    border-top: 3px solid var(--gc); padding-top: 3px; white-space: nowrap;
  }
  .strips { display: flex; gap: 3px; flex: 1; min-height: 0; }

  .strip {
    width: var(--strip); display: flex; flex-direction: column; align-items: stretch;
    background: none; border: 0; padding: 0; cursor: pointer; min-height: 0;
  }
  .clip { height: var(--clip); margin-bottom: 4px; border-radius: 2px; background: var(--line); }
  .clip.on { background: var(--hot); box-shadow: 0 0 8px var(--hot); }
  .meter {
    position: relative; flex: 1; overflow: hidden; border-radius: 3px; margin: 0 5px;
    background: linear-gradient(to top, var(--sig) 0%, var(--sig) 58%, var(--warm) 62%, var(--warm) 86%, var(--hot) 90%);
  }
  .meter .cover {
    position: absolute; inset: 0; background: var(--well);
    transform-origin: top; transform: scaleY(1); will-change: transform;
  }
  .meter .hold { position: absolute; inset: 0; will-change: transform; transform: translateY(100%); }
  .meter .hold::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #f4f6fa; }
  .meter .ticks { position: absolute; inset: 0; pointer-events: none; }
  .meter .ticks i { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.08); }
  .no-hold .meter .hold { display: none; }
  .foot { height: var(--foot); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4px; }
  .foot .num { font-size: 13px; font-weight: 600; line-height: 1.1; }
  .foot .name {
    font-size: 11px; color: var(--muted); line-height: 1.2; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .strip.muted-sig .foot .num { color: var(--muted); }

  /* Filtros */
  .filters {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 8px calc(10px + env(safe-area-inset-right, 0px)) 10px calc(10px + env(safe-area-inset-left, 0px));
  }
  .chip {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 5px 13px; font-size: 15px; white-space: nowrap; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
  .chip[aria-pressed="false"] { opacity: .45; }
  .chip[aria-pressed="false"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--gc); }

  /* Aviso y ajustes */
  .toast {
    position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px); opacity: 0; transition: opacity .15s, transform .15s;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-size: 16px; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; width: min(360px, 92vw); font-size: 17px;
  }
  dialog::backdrop { background: rgba(5, 8, 14, .6); }
  dialog h2 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  #settings label small { display: block; color: var(--muted); font-size: 13px; }
  dialog input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--sig); flex: none; }
  dialog .actions { display: flex; gap: 8px; margin-top: 16px; }
  dialog .actions button { flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--stage); cursor: pointer; }
  dialog .actions button.primary { background: var(--sig); border-color: var(--sig); color: #07130c; font-weight: 600; }
  dialog .actions button[hidden] { display: none; }
  .status { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }

  .setup-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .setup-head h2 { margin: 0; }
  .setup-head select, #optLang { font: inherit; font-size: 15px; padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); }

  /* Conexión con la mesa */
  #setup { width: min(420px, 94vw); }
  .brands { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .brands button {
    padding: 12px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--stage);
    font-size: 17px; cursor: pointer;
  }
  .brands button[aria-checked="true"] { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); }
  .hint { color: var(--muted); font-size: 15px; line-height: 1.35; margin: 12px 0 4px; min-height: 2.7em; }
  .field { display: block; margin-top: 12px; font-size: 15px; color: var(--muted); }
  .field input {
    display: block; width: 100%; margin-top: 5px; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--stage); color: var(--ink);
    font: inherit; font-size: 19px; font-variant-numeric: tabular-nums;
  }
  .field[hidden], .ports[hidden] { display: none; }
  .ports { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .error { color: var(--hot); font-size: 15px; min-height: 1.2em; margin: 10px 0 0; }
  .role-seg { display: flex; gap: 6px; margin: 0 0 12px; }
  .role-seg button { flex: 1; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; }
  .role-seg button[aria-pressed="true"] { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); }
  #roleHint { color: var(--muted); font-size: 14px; line-height: 1.3; margin: 10px 0 0; }
  #regenKey { margin-top: 10px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  /* Sin la clave de control solo se puede medir: se ocultan los ajustes que modifican la mesa. */
  body.viewer #changeMixer, body.viewer #clearLog, body.viewer #clearHistory, body.viewer #mpRow, body.viewer #ctrlSettings { display: none !important; }
  .qr { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
  .qr img { width: 150px; height: 150px; border-radius: 8px; background: #fff; }
  .qr p { margin: 0 0 8px; }
  .qr code { font-size: 16px; word-break: break-all; }
  .addr { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .addr p { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
  .addr button { display: block; width: 100%; text-align: left; margin-top: 4px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--stage); cursor: pointer; font-size: 15px; font-variant-numeric: tabular-nums; }
  .addr button[aria-pressed="true"] { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); }
  .addr button small { color: var(--muted); margin-left: 6px; }
  .qr small { display: block; color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.3; }
  .raw {
    position: fixed; inset: auto 0 0 0; max-height: 45%; overflow: auto;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 13px;
  }
  .raw[hidden] { display: none; }
  .raw h3 { margin: 6px 0; font-size: 15px; }
  .raw .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 2px 8px; font-variant-numeric: tabular-nums; }
  .raw .grid span b { color: var(--muted); font-weight: 400; margin-right: 4px; }
  .empty { align-self: center; justify-self: center; grid-column: 1 / -1; color: var(--muted); font-size: 18px; text-align: center; padding: 20px; max-width: 30ch; }
  /* Modo control */
  .modes { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
  .modes[hidden] { display: none; }
  .modes button { background: none; border: 0; padding: 6px 12px; font-size: 16px; cursor: pointer; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; }
  .icon-btn[hidden] { display: none; }
  #lockBtn[aria-pressed="false"] { border-color: var(--warm); color: var(--warm); }
  body[data-mode="control"] .board, body[data-mode="control"] .filters, body[data-mode="control"] #clearPeaks { display: none; }
  .ctrl { display: none; min-height: 0; min-width: 0; grid-template-columns: minmax(0, 1fr) auto; padding: 0 env(safe-area-inset-right, 0px) 8px env(safe-area-inset-left, 0px); }
  body[data-mode="control"] .ctrl { display: grid; }
  .cscroller { min-width: 0; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 0 8px 0 10px; }
  .cpinned { display: flex; gap: 6px; padding: 0 10px; border-left: 1px solid var(--line); }
  .cs {
    width: 84px; flex: none; display: flex; flex-direction: column; gap: 6px; min-height: 0;
    background: var(--panel); border-radius: 10px; padding: 7px 5px 6px; border-top: 3px solid transparent;
  }
  .cs.master { border-top-color: var(--g-main); }
  .cs-name { text-align: center; line-height: 1.15; min-height: 34px; }
  .cs-name b { display: block; font-size: 15px; }
  .cs { position: relative; }
  .cs-name { padding-top: 13px; }
  .cs-link { position: absolute; top: 3px; right: 3px; padding: 0 4px; border-radius: 4px; font-size: 9px; font-weight: 600; font-style: normal; line-height: 13px; background: var(--g-bus); color: #140c2a; white-space: nowrap; }
  .cs-link[hidden] { display: none; }
  .cs-name span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cs-gain { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "val val" "dn up"; gap: 3px 4px; }
  .cs-gain output { grid-area: val; }
  .cs-gain .gdn { grid-area: dn; }
  .cs-gain .gup { grid-area: up; }
  .cs-gain button { height: 30px; border: 1px solid var(--line); background: var(--stage); border-radius: 6px; padding: 0; cursor: pointer; font-size: 17px; line-height: 1; touch-action: manipulation; }
  .cs-gain output { text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cs-gain output small { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .nogain .cs-gain { visibility: hidden; }
  /* El ON queda separado de los botones de ganancia para no tocarlo sin querer */
  .cs-on {
    margin-top: 12px; position: relative; overflow: visible;
    height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--stage);
    font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; touch-action: manipulation;
  }
  .cs-on::before { content: ""; position: absolute; left: 4px; right: 4px; top: -8px; height: 1px; background: var(--line); }
  .cs-on[aria-pressed="true"] { background: var(--warm); border-color: var(--warm); color: #231703; }
  .cs-fader { position: relative; flex: 1; min-height: 120px; display: grid; grid-template-columns: 7px 1fr 19px; gap: 3px; touch-action: pan-x; cursor: ns-resize; }
  /* Escala del fader en dB, como la impresa junto a los faders de la mesa */
  .cs-scale { position: relative; margin: 11px 0; font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
  .cs-scale span { position: absolute; right: 0; transform: translateY(50%); line-height: 1; white-space: nowrap; }
  .cs-track .tk { position: absolute; left: 50%; width: 14px; margin-left: -7px; height: 1px; background: var(--muted); opacity: .55; }
  .cs-scale span.z { color: var(--ink); font-weight: 700; }
  .cs-meter { position: relative; overflow: hidden; border-radius: 2px; background: linear-gradient(to top, var(--sig) 0%, var(--sig) 58%, var(--warm) 62%, var(--warm) 86%, var(--hot) 90%); margin: 11px 0; }
  .cs-meter .cover { position: absolute; inset: 0; background: var(--well); transform-origin: top; will-change: transform; }
  .cs-track { position: relative; margin: 11px 0; }
  .cs-track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--well); }
  .cs-track .zero { position: absolute; left: 4px; right: 4px; height: 1px; background: var(--muted); opacity: .6; }
  .cs-cap {
    position: absolute; left: 50%; top: 0; width: 38px; height: 22px; margin: -11px 0 0 -19px;
    border-radius: 5px; background: #d9dde6; box-shadow: 0 2px 5px rgba(0,0,0,.45); will-change: transform;
  }
  .cs-cap::after { content: ""; position: absolute; left: 6px; right: 6px; top: 10px; height: 2px; background: #1a1f2a; }
  .cs.dragging .cs-cap { background: #ffffff; box-shadow: 0 0 0 2px var(--sig), 0 2px 8px rgba(0,0,0,.5); }
  .cs-val { text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; height: 18px; }
  body.locked .cs-gain button, body.locked .cs-on { opacity: .45; }
  body.locked .cs-cap { background: #8f96a5; }
  body.locked .cs-fader { cursor: not-allowed; }
  .ctrl-empty { align-self: center; color: var(--muted); font-size: 18px; padding: 20px; }
  .cs-gain.ext output small { color: var(--g-ch); font-weight: 600; }
  .shure-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 15px; }
  .shure-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .shure-list li span { flex: 1; }
  .shure-list .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); flex: none; }
  .shure-list .dot.on { background: var(--sig); }
  .shure-list button, .shure-form button { border: 1px solid var(--line); background: var(--stage); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 15px; }
  .shure-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .shure-form input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--stage); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin-top: 3px; }
  .shure-form .ip { grid-column: 1 / -1; }
  .shure-form select { display: block; width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--stage); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin-top: 3px; }
  .shure-form button { grid-column: 1 / -1; }
  .shure-hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; line-height: 1.35; }
  #settings select { font: inherit; font-size: 16px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); }
  #settings .sub { margin: 16px 0 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  /* Registro del bolo */
  #reportBtn { position: relative; }
  #reportBtn .badge {
    position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--hot); color: #fff; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center;
  }
  #reportBtn .badge[hidden] { display: none; }
  #report { width: min(560px, 94vw); max-height: 88vh; }
  #report h3 { margin: 16px 0 6px; font-size: 18px; font-weight: 600; }
  #report h3:first-of-type { margin-top: 4px; }
  .clip-list { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; }
  .clip-list li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
  .clip-list li:last-child { border-bottom: 0; }
  .clip-list li time { color: var(--muted); }
  .clip-list li b { color: var(--hot); font-weight: 600; }
  .clip-list li.new { background: color-mix(in srgb, var(--hot) 12%, transparent); }
  .clip-list .empty-row { display: block; color: var(--muted); }
  .rep-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .rep-actions button, .rep-actions a {
    flex: 1; min-width: 130px; text-align: center; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--stage); color: var(--ink); font-size: 15px; cursor: pointer; text-decoration: none;
  }
  .chart-wrap { position: relative; border: 1px solid var(--line); border-radius: 9px; padding: 6px; touch-action: pan-y; }
  #histChart { display: block; width: 100%; height: 190px; }
  .chart-read { font-size: 14px; font-variant-numeric: tabular-nums; min-height: 1.3em; margin: 6px 0 0; color: var(--muted); }
  .chart-legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .chart-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
  .sel-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .sel-chip, .pick-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--stage); font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap; }

  .picker { border: 1px solid var(--line); border-radius: 9px; padding: 8px; margin-bottom: 8px; max-height: 38vh; overflow-y: auto; }

  .picker .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .pick-chip[aria-pressed="true"] { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); }
  .picker .done { display: block; width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 15px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin: 0 0 8px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--sig); }
  .rep-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .rep-head h2 { margin: 0; }
  .rep-head button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--stage); color: var(--ink); font-size: 14px; cursor: pointer; }
  .rep-head button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .rep-head button[hidden] { display: none; }
  /* En el ordenador: panel flotante que se arrastra por el título y no bloquea lo de detrás */
  #report.floating { position: fixed; margin: 0; z-index: 40; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  #report.floating .rep-head { cursor: move; user-select: none; touch-action: none; }
  /* Ventana aparte (?vista=registro): solo el registro, a toda la ventana */
  body.report-only .board, body.report-only .ctrl, body.report-only .filters,
  body.report-only .bar .icon-btn, body.report-only .modes { display: none !important; }
  body.report-only #report { position: static; grid-row: 2 / 4; width: auto; max-width: none; max-height: none; height: auto;
    margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; overflow: auto; padding: 16px 20px; }
  body.report-only #histChart { height: max(220px, 42vh); }
  body.report-only .clip-list { max-height: 30vh; }
  .rep-note { font-size: 13px; color: var(--muted); margin: 6px 0 0; line-height: 1.35; }

  /* Vista grande: un canal o todo su grupo (link / pareja estéreo) */
  .big { position: fixed; inset: 0; z-index: 50; background: var(--stage); display: flex; flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px)); cursor: pointer; }
  .big[hidden] { display: none; }

  .big-card { container-type: size; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(28px, 26%) minmax(0, 1fr); gap: 4cqi;
    background: var(--panel); border-radius: 12px; padding: 10px; }
  .big-grid.one .big-card { background: none; padding: 0; }
  .big-meter { position: relative; overflow: hidden; border-radius: 8px;
    background: linear-gradient(to top, var(--sig) 0%, var(--sig) 58%, var(--warm) 62%, var(--warm) 86%, var(--hot) 90%); }
  .big-meter .cover { position: absolute; inset: 0; background: var(--well); transform-origin: top; will-change: transform; }
  .big-meter .hold { position: absolute; inset: 0; will-change: transform; }
  .big-meter .hold::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #f4f6fa; }
  .big-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .big-name { font-size: clamp(14px, min(9cqi, 11cqh), 54px); font-weight: 600; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .big-val { font-size: clamp(20px, min(17cqi, 26cqh), 190px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin: .15em 0; white-space: nowrap; }
  .big-val small { font-size: .3em; font-weight: 500; color: var(--muted); margin-left: .15em; }
  .big-peak { font-size: clamp(12px, min(7cqi, 9cqh), 44px); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big-clip { display: inline-block; margin-top: .5em; padding: .15em .6em; border-radius: 8px; background: var(--hot); color: #fff; font-weight: 700; font-size: clamp(12px, min(6cqi, 8cqh), 32px); }
  .big-clip[hidden] { display: none; }
  .big-hint { text-align: center; color: var(--muted); font-size: 14px; padding-top: 8px; }

  /* Capas del modo Control */
  .layers { display: none; gap: 6px; overflow-x: auto; align-items: center;
    padding: 8px calc(10px + env(safe-area-inset-right, 0px)) 10px calc(10px + env(safe-area-inset-left, 0px)); }
  body[data-mode="control"] .layers { display: flex; }
  .layers button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 13px; font-size: 15px; white-space: nowrap; cursor: pointer; flex: none; }
  .layers button[aria-pressed="true"] { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); font-weight: 600; }
  .layers .edit { padding: 6px 10px; }
  .layers .sep { flex: 1; min-width: 6px; }
  .layers .stereo[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
  .cpinned[hidden] { display: none; }
  .cs.g-ch { border-top-color: var(--g-ch); }
  .cs.g-bus { border-top-color: var(--g-bus); }
  .cs.g-mtx { border-top-color: var(--g-mtx); }
  .cs[hidden] { display: none; }
  .custom-empty { align-self: center; color: var(--muted); font-size: 16px; padding: 20px; max-width: 32ch; line-height: 1.4; }
  #customDlg { width: min(560px, 94vw); max-height: 90vh; }
  #customDlg .picker { max-height: 58vh; }
  .cu-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  .cu-top button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); cursor: pointer; }
  .pick-chip .ord { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--sig); color: #07130c; font-size: 11px; font-weight: 700; }

  /* Mensajes */
  #msgBtn { position: relative; }
  #msgBtn .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--g-ch); color: #06222c; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; }
  #msgBtn .badge[hidden] { display: none; }
  #msgDlg { width: min(520px, 94vw); max-height: 90vh; }
  .msg-link { font-size: 13px; margin: 0 0 8px; color: var(--muted); }
  .msg-link.off { color: var(--hot); }
  .msg-list { list-style: none; margin: 0 0 10px; padding: 0; max-height: 32vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; }
  .msg-list li { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .msg-list li:last-child { border-bottom: 0; }
  .msg-list li.mine { background: color-mix(in srgb, var(--g-ch) 8%, transparent); }
  .msg-list .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .msg-list .body { margin-top: 2px; }
  .msg-list .body b { color: var(--g-ch); font-weight: 600; margin-right: 6px; }
  .msg-list .ack { font-size: 12px; color: var(--sig); margin-top: 2px; }
  .msg-list .empty-row { color: var(--muted); }
  .msg-quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 8px 0; }
  .msg-quick button, .msg-compose button { padding: 10px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); font-size: 15px; cursor: pointer; }
  .msg-compose { display: flex; gap: 6px; }
  .msg-compose input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); }
  .msg-compose button { background: var(--sig); border-color: var(--sig); color: #07130c; font-weight: 600; }
  .msg-ch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .msg-ch select { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); }
  /* Aviso de mensaje recibido: grande, hasta pulsar Visto */
  .msg-banner { position: fixed; left: 10px; right: 10px; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 60; /* debajo de la barra: sus botones siguen accesibles */

  .msg-banner[hidden] { display: none; }

  .msg-banner .txt { font-size: clamp(20px, 5.5vw, 30px); font-weight: 700; line-height: 1.15; }
  .msg-banner .ch { display: block; font-size: .7em; color: var(--g-ch); margin-top: 2px; }
  .msg-banner button { padding: 12px 18px; border-radius: 10px; border: 0; background: var(--g-ch); color: #06222c; font-weight: 700; font-size: 17px; cursor: pointer; }
  /* Line check */
  #lcDlg { width: min(560px, 94vw); max-height: 92vh; }
  .lc-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .lc-top .prog { flex: 1; min-width: 160px; font-size: 15px; }
  .lc-top .prog small { display: block; color: var(--warm); font-size: 13px; }
  .lc-top button { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); font-size: 15px; cursor: pointer; }
  .lc-top button.primary { background: var(--sig); border-color: var(--sig); color: #07130c; font-weight: 600; }
  .lc-top button[hidden] { display: none; }
  .lc-hint { font-size: 14px; color: var(--muted); margin: 0 0 8px; line-height: 1.35; }
  .lc-list { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; }
  .lc-list li { display: grid; grid-template-columns: minmax(0, 1fr) 60px auto; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 15px; cursor: pointer; }
  .lc-list li:last-child { border-bottom: 0; }
  .lc-list li[hidden] { display: none; }
  .lc-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-list .lvl { display: block; height: 8px; border-radius: 4px; background: var(--well); overflow: hidden; }
  .lc-list .lvl i { display: block; height: 100%; width: 0; background: var(--sig); }
  .lc-list .st { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); text-align: right; }
  .lc-list li.ok .st { color: var(--sig); }
  .lc-list li.noise .st { color: var(--warm); }
  .lc-sum { font-size: 14px; margin: 8px 0 0; }
  .set-btn { display: block; width: 100%; margin: 4px 0 10px; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); font-size: 16px; cursor: pointer; }
  #settings .set-field { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #settings .set-field[hidden] { display: none; }
  .set-field small { display: block; color: var(--muted); font-size: 13px; }
  .set-field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--stage); color: var(--ink); }

  @media (max-width: 420px) {
    .bar { gap: 4px; padding-left: calc(8px + env(safe-area-inset-left, 0px)); padding-right: calc(6px + env(safe-area-inset-right, 0px)); }

</style>

<body>
<header class="bar">
  <button class="status" id="status" data-state="offline" data-i18n-aria="a.changeMixer"><span class="dot"></span><span id="statusText" role="status" data-i18n="status.initial"></span></button>
  <div class="modes" id="modes" hidden>

  </div>
  <button class="icon-btn" id="clearPeaks" data-i18n-aria="btn.resetClips">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>

    <span class="badge" id="reportBadge" hidden></span>

  <button class="icon-btn" id="msgBtn" data-i18n-aria="a.msgs">

  <button class="icon-btn" id="lockBtn" data-i18n-aria="a.unlock" aria-pressed="true" hidden>
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="lockShackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </button>
  <button class="icon-btn" id="openPhone" data-i18n-aria="a.phone" hidden>
    <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
  </button>
  <button class="icon-btn" id="openSettings" data-i18n-aria="a.settings">
    <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</header>

<main class="board" id="board">

</main>

<nav class="filters" id="filters" data-i18n-aria="a.groups"></nav>
<nav class="layers" id="layers" data-i18n-aria="ly.aria"></nav>

<div class="toast" id="toast"></div>

<section class="raw" id="raw" hidden data-i18n-aria="a.raw"></section>

<dialog id="settings">
  <h2 data-i18n="set.title"></h2>

  <label><span data-i18n="set.lang"></span><select id="optLang"></select></label>

<dialog id="report" aria-labelledby="repTitle">
  <div class="rep-head" id="repHead" data-i18n-title="rep.drag">
    <h2 id="repTitle" data-i18n="rep.title"></h2>
    <button id="repPopout" hidden><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span data-i18n="rep.popout"></span></button>
