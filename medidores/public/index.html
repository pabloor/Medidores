<script>window.APP_VERSION = '__APP_VERSION__'; window.APP_ROLE = '__APP_ROLE__';</script>
<script src="i18n.js?v=__APP_VERSION__"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const REPORT_ONLY = new URLSearchParams(location.search).get('vista') === 'registro';
  // 'sala' = versión completa; 'escenario' = solo lectura (se enlaza con la app de sala para mensajes y line check).
  const ROLE = window.APP_ROLE === 'escenario' ? 'escenario' : 'sala';
  if (ROLE === 'escenario') document.body.classList.add('role-escenario');
  if (REPORT_ONLY) document.body.classList.add('report-only');
  applyI18n();
  const store = {
    get(k, d) { try { const v = localStorage.getItem('medidores:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('medidores:' + k, JSON.stringify(v)); } catch {} },
  };

  // Clave de control: llega en el enlace (?k=...) y el móvil la recuerda. Sin ella, la app solo mide.
  {
    const u = new URL(location.href), k = u.searchParams.get('k');
    if (k) { store.set('ck', k); u.searchParams.delete('k'); history.replaceState(null, '', u); }
  }
  let canControl = false, controlKey = '';

  // Escala tipo consola: más resolución cerca de 0 dBFS.
  const PTS = [[-60, 0], [-48, .1], [-36, .24], [-24, .42], [-18, .53], [-12, .66], [-6, .82], [-3, .91], [0, 1]];
  function pos(db) {
    if (db <= PTS[0][0]) return 0;
    for (let i = 1; i < PTS.length; i++) {
      const [d1, p1] = PTS[i], [d0, p0] = PTS[i - 1];
      if (db <= d1) return p0 + (p1 - p0) * (db - d0) / (d1 - d0);
    }
    return 1;
  }
  const TICKS = [0, -3, -6, -12, -18, -24, -36, -48];
  const GROUP_COLORS = { ch: '--g-ch', bus: '--g-bus', mtx: '--g-mtx', fxr: '--g-fx', fxs: '--g-fx', aux: '--g-fx', main: '--g-main' };
  const FALL = 26;      // dB por segundo de caída
  const HOLD_MS = 1600; // retención de pico
  const CLIP_DB = 0; // igual que la DM7 (verificado con tono): se enciende al llegar a 0 dB

  let strips = [];   // estado plano de todas las tiras
  let groupStart = []; // índice plano donde empieza cada grupo
  let layoutKey = '';
  let hidden = new Set(store.get('hidden', []));

  // --- Escala lateral
  function drawScale() {
    $('scale').innerHTML = TICKS.map((d) => `<span style="bottom:${pos(d) * 100}%">${d}</span>`).join('');
  }

  // --- Construcción del tablero a partir del layout de la mesa
  function buildLayout(l) {
    const key = JSON.stringify(l.groups.map((g) => [g.id, g.strips.length]));
    if (key === layoutKey) return relabel(l);
    layoutKey = key;
    strips = [];
    groupStart = [];
    const scroller = $('scroller'), pinned = $('pinned'), filters = $('filters');
    scroller.innerHTML = pinned.innerHTML = filters.innerHTML = '';
    const ticks = '<div class="ticks">' + TICKS.slice(1).map((d) => `<i style="bottom:${pos(d) * 100}%"></i>`).join('') + '</div>';

    l.groups.forEach((g, gi) => {
      groupStart[gi] = strips.length;
      const color = `var(${GROUP_COLORS[g.id] || '--g-ch'})`;
      const sec = document.createElement('section');
      sec.className = 'group';
      sec.style.setProperty('--gc', color);
      sec.dataset.id = g.id;
      sec.innerHTML = `<div class="group-head">${esc(groupName(g))}</div><div class="strips"></div>`;
      const row = sec.querySelector('.strips');
      g.strips.forEach((s) => {
        const el = document.createElement('button');
        el.className = 'strip';
        el.innerHTML = `<div class="clip"></div><div class="meter"><div class="cover"></div><div class="hold"></div>${ticks}</div>
          <div class="foot"><span class="num"></span><span class="name"></span></div>`;
        const st = {
          el, cover: el.querySelector('.cover'), hold: el.querySelector('.hold'), clipEl: el.querySelector('.clip'),
          num: el.querySelector('.num'), name: el.querySelector('.name'),
          target: -90, disp: -90, peak: -90, peakAt: 0, maxSeen: -90, clip: false, lastCover: -1, lastHold: -1,
          group: g.name, label: '', gid: g.id, idx: g.strips.indexOf(s),
        };
        // Mantener pulsado: vista grande del canal. Toque corto: borrar su pico.
        let lpTimer = null, lpX = 0, lpY = 0;
        el.addEventListener('pointerdown', (e) => {
          lpX = e.clientX; lpY = e.clientY; st.longPressed = false;
          clearTimeout(lpTimer);
          if (ROLE === 'escenario') return; // la vista grande es de la versión de sala
          lpTimer = setTimeout(() => { st.longPressed = true; openBig(st); }, 550);
        });
        el.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - lpX, e.clientY - lpY) > 12) clearTimeout(lpTimer); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => el.addEventListener(ev, () => clearTimeout(lpTimer)));
        el.addEventListener('contextmenu', (e) => e.preventDefault());
        el.addEventListener('click', () => {
          if (st.longPressed) { st.longPressed = false; return; }
          st.clip = false; st.clipEl.classList.remove('on');
          toast(t('toast.peak', { label: st.label, v: st.maxSeen <= -89 ? t('peak.none') : st.maxSeen.toFixed(1) + ' dB' }));
          st.maxSeen = st.target;
          st.peak = st.disp;
          sendClear({ g: st.gid, i: st.idx });
        });
        strips.push(st);
        row.appendChild(el);
      });
      (g.id === 'main' ? pinned : scroller).appendChild(sec);

      {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.style.setProperty('--gc', color);
        chip.textContent = groupName(g);
        const apply = () => {
          chip.setAttribute('aria-pressed', String(!hidden.has(g.id)));
          sec.hidden = hidden.has(g.id);
          if (g.id === 'main') pinned.hidden = hidden.has(g.id); // la columna fija del Stereo, con su borde
        };
        chip.addEventListener('click', () => {
          hidden.has(g.id) ? hidden.delete(g.id) : hidden.add(g.id);
          store.set('hidden', [...hidden]);
          apply();
        });
        apply();
        filters.appendChild(chip);
      }
    });
    relabel(l);
  }

  let lastLayout = null;
  // Nombre de grupo: en español, el que da la mesa (p. ej. "Mix" en Yamaha); en otros idiomas, la traducción.
  function groupName(g) {
    if (LANG === 'es' || !I18N[LANG]['grp.' + g.id]) return g.name;
    return t('grp.' + g.id);
  }
  let meterPoint = null;
  function refreshGroupHeads() {
    document.querySelectorAll('.group[data-id]').forEach((sec) => {
      const g = lastLayout && lastLayout.groups.find((x) => x.id === sec.dataset.id);
      if (!g) return;
      sec.querySelector('.group-head').textContent = groupName(g) + (g.id === 'ch' && meterPoint ? ` · ${t('mp.' + meterPoint)}` : '');
    });
  }
  function relabel(l) {
    lastLayout = l;
    refreshGroupHeads();
    relabelControl();
    l.groups.forEach((g, gi) => g.strips.forEach((s, si) => {
      const st = strips[groupStart[gi] + si];
      if (!st) return;
      st.num.textContent = s.num;
      st.name.textContent = s.name || '';
      st.label = s.name ? `${s.num} ${s.name}` : `${groupName(g)} ${s.num}`;
      st.el.setAttribute('aria-label', st.label);
    }));
  }

  // --- Datos entrantes
  function onMeters(groups) {
    let k = 0;
    groups.forEach((vals, gi) => vals.forEach((db, si) => {
      const st = strips[groupStart[gi] + si];
      if (!st) return;
      st.target = db;
      if (db > st.maxSeen) st.maxSeen = db;
      if (db >= CLIP_DB && !st.clip) { st.clip = true; st.clipEl.classList.add('on'); }
      k++;
    }));
    lastData = performance.now();
  }
  let lastData = 0;
  let holdForever = true; // con "Retener picos" activado, el pico se queda hasta borrarlo

  // --- Animación (balística tipo consola: sube al instante, cae a velocidad fija)
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - prev) / 1000);
    prev = now;
    const stale = now - lastData > 1500;
    for (const st of strips) {
      const target = stale ? -90 : st.target;
      st.disp = target > st.disp ? target : Math.max(target, st.disp - FALL * dt);
      if (st.disp >= st.peak) { st.peak = st.disp; st.peakAt = now; }
      else if (!holdForever && now - st.peakAt > HOLD_MS) st.peak = Math.max(st.disp, st.peak - FALL * 1.5 * dt);
      const c = Math.round((1 - pos(st.disp)) * 400) / 400;
      if (c !== st.lastCover) { st.cover.style.transform = `scaleY(${c})`; st.lastCover = c; }
      const h = Math.round((1 - pos(st.peak)) * 400) / 4;
      if (h !== st.lastHold) { st.hold.style.transform = `translateY(${h}%)`; st.lastHold = h; }
    }
    if (bigCards.length) renderBig(now);
    if (mode === 'control') for (const cs of cstrips) {
      const src = meterSources(cs);
      let d = -90;
      for (const st of src) if (st.disp > d) d = st.disp;
      const c = Math.round((1 - pos(d)) * 400) / 400;
      if (c !== cs.lastCover) { cs.cover.style.transform = `scaleY(${c})`; cs.lastCover = c; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- Conexión con el servidor puente
  let ws, wantRaw = false;
  function connect() {
    const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?k=${encodeURIComponent(store.get('ck', ''))}`;
    ws = new WebSocket(url);
    ws.onopen = () => { if (wantRaw) ws.send(JSON.stringify({ type: 'raw', on: true })); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'role') onRole(m);
      else if (m.type === 'meters') onMeters(m.g);
      else if (m.type === 'layout') {
        buildLayout(m);
        document.title = REPORT_ONLY ? `${t('rep.title')} · ${m.mixer.name}` : `${t('title')}: ${m.mixer.name}`;
        if (REPORT_ONLY) { if (!$('report').open) openReport(); else { renderSelRow(); renderClipList(); } }
      }
      else if (m.type === 'status') setStatus(m.state, m.key && I18N.es[m.key] ? t(m.key, m.p) : m.detail);
      else if (m.type === 'meter-point') onMeterPoint(m);
      else if (m.type === 'clear-peaks') clearPeaks(m);
      else if (m.type === 'clip-log') onClipLog(m.events || []);
      else if (onShared(m)) {}
      else if (m.type === 'history') { histData = m; if ($('report').open) drawHistory(); }
      else if (m.type === 'history-cleared') { histData = null; if ($('report').open) { drawHistory(); askHistory(); } }
      else if (m.type === 'raw') drawRaw(m.raw);
      else if (m.type === 'config') onConfig(m);
      else if (m.type === 'reset') resetBoard();
      else if (m.type === 'connect-error') $('setupError').textContent = m.key ? t(m.key, m.p) : m.error;
      else if (m.type === 'control') buildControl(m);
      else if (m.type === 'param') onParam(m);
      else if (m.type === 'shure') onShure(m);
      else if (m.type === 'nics') onNics(m);
      else if (m.type === 'shure-error') $('shErr').textContent = m.key ? t(m.key, m.p) : m.error;
    };
    ws.onclose = () => {
      setStatus('offline', t('st.offline'));
      setTimeout(connect, 1500);
    };
  }
  function setStatus(state, text) {
    $('status').dataset.state = state;
    $('statusText').textContent = text;
    if (state === 'setup' && !setup.open && canControl) openSetup();
    if (state !== 'connected' && !strips.length) showEmpty(text);
  }
  function showEmpty(text) {
    $('scroller').innerHTML = `<div class="empty">${esc(text)}</div>`;
  }
  connect();

  // --- Valores en bruto
  function drawRaw(raw) {
    const panel = $('raw');
    if (panel.hidden) return;
    panel.innerHTML = Object.entries(raw).map(([path, vals]) =>
      `<h3>${esc(path)} (${t('raw.values', { n: vals.length })})</h3><div class="grid">` +
      vals.map((v, i) => `<span><b>${i}</b>${v <= -89 ? '–' : v.toFixed(1)}</span>`).join('') + '</div>').join('');
  }

  // --- Ajustes
  const dlg = $('settings');
  $('openSettings').onclick = () => dlg.showModal();
  $('closeSettings').onclick = () => dlg.close();
  $('clearPeaks').onclick = () => { clearPeaks(null); sendClear({}); toast(t('toast.clipsCleared')); };
  // Borrado de picos y saturaciones, compartido entre todos los móviles.
  function clearStrip(s) { s.clip = false; s.clipEl.classList.remove('on'); s.maxSeen = s.target; s.peak = s.disp; }
  function clearPeaks(m) {
    if (!m || m.g == null) return strips.forEach(clearStrip);
    const s = strips.find((x) => x.gid === m.g && x.idx === m.i);
    if (s) clearStrip(s);
  }
  function sendClear(m) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'clear-peaks', ...m }));
  }

  const optHold = $('optHold'), optLight = $('optLight'), optRaw = $('optRaw');
  optHold.checked = store.get('hold', true);
  optLight.checked = store.get('light', false);
  const applyOpts = () => {
    document.body.classList.toggle('no-hold', !optHold.checked);
    holdForever = optHold.checked;
    document.documentElement.dataset.theme = optLight.checked ? 'light' : 'dark';
    document.querySelector('meta[name="theme-color"]').content = optLight.checked ? '#e9ecf2' : '#141925';
  };
  optHold.onchange = () => { store.set('hold', optHold.checked); applyOpts(); };
  optLight.onchange = () => { store.set('light', optLight.checked); applyOpts(); };
  optRaw.onchange = () => {
    wantRaw = optRaw.checked;
    $('raw').hidden = !wantRaw;
    if (!wantRaw) $('raw').innerHTML = '';
    else $('raw').textContent = t('raw.waiting');
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'raw', on: wantRaw }));
  };
  applyOpts();
  drawScale();

  // --- Conexión con la mesa
  const setup = $('setup');
  const HINTS = {
    auto: ['hint.auto', 'setup.ipOpt'],
    yamaha: ['hint.yamaha', 'setup.ip'],
    digico: ['hint.digico', 'setup.ip'],
    sim: ['hint.sim', null],
  };
  let current = null, chosen = null, urls = [], ifaces = [], addrIndex = 0, qrRole = 'view';
  function onRole(m) {
    canControl = m.role === 'control';
    controlKey = m.key || '';
    document.body.classList.toggle('viewer', !canControl);
    if (!canControl) { $('modes').hidden = true; $('ctrlSettings').hidden = true; setMode('meters', false); }
    else { $('modes').hidden = !ctrl; $('ctrlSettings').hidden = !ctrl; }
    showAddr(Math.min(addrIndex, Math.max(0, urls.length - 1)));
  }
  $('roleView').onclick = () => { qrRole = 'view'; showAddr(addrIndex); };
  $('roleCtl').onclick = () => { qrRole = 'control'; showAddr(addrIndex); };
  $('regenKey').onclick = () => { if (confirm(t('phone.regenConfirm')) && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'control-key-regen' })); };
  // Ventana del QR: dirección elegida y, si el Mac tiene varias, la lista para cambiarla.
  function showAddr(i) {
    addrIndex = i;
    const ctl = qrRole === 'control' && controlKey;
    $('phoneUrl').textContent = urls[i] ? (ctl ? `${urls[i].replace(/\/$/, '')}/?k=${controlKey}` : urls[i]) : t('phone.noNet');
    document.querySelector('#phone .qr img').src = `qr.svg?i=${i}${ctl ? '&role=control' : ''}&t=${Date.now()}`;
    $('roleSeg').hidden = !controlKey;
    $('roleView').setAttribute('aria-pressed', String(!ctl));
    $('roleCtl').setAttribute('aria-pressed', String(!!ctl));
    $('roleHint').hidden = !controlKey;
    $('roleHint').textContent = t(ctl ? 'phone.ctlHint' : 'phone.viewHint');
    $('regenKey').hidden = !ctl;
    $('phoneAddrs').hidden = urls.length < 2;
    $('phoneAddrList').innerHTML = '';
    urls.forEach((u, k) => {
      const b = document.createElement('button');
      b.setAttribute('aria-pressed', String(k === i));
      b.innerHTML = `${esc(u.replace('http://', ''))}<small>${esc(ifaces[k] || '')}</small>`;
      b.onclick = () => showAddr(k);
      $('phoneAddrList').appendChild(b);
    });
  }
  const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);

  function onConfig(m) {
    // Copia antigua de la página (caché del móvil): recargar una vez con la versión nueva.
    if (m.version && /^[0-9a-f]{10}$/.test(window.APP_VERSION) && m.version !== window.APP_VERSION) {
      let tried = null;
      try { tried = sessionStorage.getItem('medidores:reloadFor'); sessionStorage.setItem('medidores:reloadFor', m.version); } catch {}
      if (tried !== m.version) { location.reload(); return; }
    }
    current = m.config;
    urls = m.urls || [];
    ifaces = m.ifaces || [];
    showAddr(Math.min(addrIndex, Math.max(0, urls.length - 1)));
    $('openPhone').hidden = !isLocal;
  }
  function resetBoard() {
    strips = []; groupStart = []; layoutKey = ''; lastLayout = null;
    if (typeof closeBig === 'function') closeBig();
    ctrl = null; cstrips = []; ctrlKey = '';
    $('cscroller').innerHTML = $('cpinned').innerHTML = '';
    $('layers').innerHTML = '';
    $('modes').hidden = true; $('lockBtn').hidden = true; $('ctrlSettings').hidden = true;
    setMode('meters', false);
    $('pinned').innerHTML = $('filters').innerHTML = '';
    showEmpty(t('empty.connecting'));
  }
  function choose(driver) {
    chosen = driver;
    setup.querySelectorAll('.brands button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.driver === driver)));
    const [hint, label] = HINTS[driver];
    $('brandHint').textContent = t(hint);
    $('ipField').hidden = driver === 'sim';
    $('ipLabel').textContent = label ? t(label) : '';
    $('digicoFields').hidden = driver !== 'digico';
    $('setupError').textContent = '';
    if (!$('ipField').hidden) $('ipInput').focus();
  }
  function openSetup() {
    const c = current || {};
    $('ipInput').value = c.ip || '';
    $('sendPort').value = c['send-port'] || '';
    $('listenPort').value = c['listen-port'] || '';
    $('setupCancel').hidden = !current;
    choose(c.driver && HINTS[c.driver] ? c.driver : 'auto');
    if (dlg.open) dlg.close();
    setup.showModal();
  }
  setup.querySelectorAll('.brands button').forEach((b) => b.addEventListener('click', () => choose(b.dataset.driver)));
  $('setupCancel').onclick = () => setup.close();
  setup.addEventListener('cancel', (e) => { if (!current) e.preventDefault(); });
  $('setupConnect').onclick = () => {
    const ip = $('ipInput').value.trim();
    if ((chosen === 'yamaha' || chosen === 'digico') && !ip) { $('setupError').textContent = t('err.needIp'); return; }
    if (ip && !/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { $('setupError').textContent = t('err.ipForm', { ex: '192.168.1.20' }); return; }
    if (!ws || ws.readyState !== 1) { $('setupError').textContent = t('err.noBridge'); return; }
    ws.send(JSON.stringify({ type: 'connect', driver: chosen, ip, 'send-port': $('sendPort').value.trim(), 'listen-port': $('listenPort').value.trim() }));
    setup.close();
    if (isLocal && urls.length && !store.get('phoneShown', false)) { store.set('phoneShown', true); $('phone').showModal(); }
  };
  $('ipInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('setupConnect').click(); });
  $('status').onclick = () => { if (canControl) openSetup(); else toast(t('role.viewer')); };
  $('changeMixer').onclick = openSetup;
  $('openPhone').onclick = () => $('phone').showModal();
  $('closePhone').onclick = () => $('phone').close();

  // =============== Control (Yamaha) ===============
  // Recorrido del fader parecido al de una consola: más espacio alrededor de 0 dB.
  const FP = [[-60, .04], [-40, .16], [-30, .27], [-20, .42], [-10, .6], [-5, .7], [0, .8], [5, .9], [10, 1]];
  function fpos(db) {
    if (db === -Infinity || db == null) return 0;
    if (db < -60) return Math.max(0, .04 * (db + 138) / 78);
    for (let i = 1; i < FP.length; i++) {
      const [d1, p1] = FP[i], [d0, p0] = FP[i - 1];
      if (db <= d1) return p0 + (p1 - p0) * (db - d0) / (d1 - d0);
    }
    return 1;
  }
  function fdb(p) {
    if (p <= .003) return -Infinity;
    if (p < .04) return Math.round(-138 + 78 * p / .04);
    for (let i = 1; i < FP.length; i++) {
      const [d1, p1] = FP[i], [d0, p0] = FP[i - 1];
      if (p <= p1) {
        const db = d0 + (d1 - d0) * (p - p0) / (p1 - p0);
        if (Math.abs(db) < .4) return 0; // retén en 0 dB
        return db > -10 ? Math.round(db * 10) / 10 : Math.round(db * 2) / 2;
      }
    }
    return 10;
  }
  const fmtDb = (v) => (v == null ? '—' : v === -Infinity ? '−∞' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1));
  const fmtGain = (v) => (v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v));
  const fromWire = (v) => (v === '-inf' ? -Infinity : v);
  const toWire = (v) => (v === -Infinity ? '-inf' : v);

  let ctrl = null, cstrips = [], ctrlKey = '', mode = 'meters', locked = true, lockTimer;
  let faderLimit = store.get('limit', 0);
  let autolock = store.get('autolock', true);

  const CTRL_GROUPS = ['ch', 'bus', 'mtx']; // grupos que van en la lista desplazable; 'main' va fijo a la derecha
  function buildControl(m) {
    const conv = (arr) => (arr || []).map((c) => ({ ...c, fader: fromWire(c.fader) }));
    ctrl = { caps: m.caps, ch: conv(m.ch), main: conv(m.main), bus: conv(m.bus), mtx: conv(m.mtx) };
    const key = `${ctrl.ch.length}/${ctrl.bus.length}/${ctrl.mtx.length}/${ctrl.main.length}/${!!ctrl.caps.gain}`;
    if (key !== ctrlKey) {
      ctrlKey = key;
      cstrips = [];
      const sc = $('cscroller'), pin = $('cpinned');
      sc.innerHTML = pin.innerHTML = '';
      for (const g of CTRL_GROUPS) ctrl[g].forEach((_, i) => sc.appendChild(makeStrip(g, i)));
      ctrl.main.forEach((_, i) => pin.appendChild(makeStrip('main', i)));
      buildLayerBar();
    }
    applyLayer();
    relabelControl();
    $('modes').hidden = !canControl;
    $('ctrlSettings').hidden = !canControl;
    setMode(store.get('mode', 'meters'), false);
  }

  function makeStrip(g, i) {
    const el = document.createElement('div');
    const hasGain = g === 'ch'; // HA de la mesa o, si no hay, ganancia de un receptor Shure
    el.className = `cs g-${g}` + (g === 'main' ? ' master' : '') + (hasGain ? '' : ' nogain');
    el.innerHTML = `
      <div class="cs-name"><b></b><i class="cs-link" hidden></i><span></span></div>
      <div class="cs-gain"><button class="gdn" aria-label="${t('a.gainDown')}">−</button><output><span></span><small class="gunit">dB</small></output><button class="gup" aria-label="${t('a.gainUp')}">+</button></div>
      <button class="cs-on" aria-pressed="false">ON</button>
      <div class="cs-fader"><div class="cs-meter"><div class="cover"></div></div>
        <div class="cs-track"><div class="zero" style="bottom:${fpos(0) * 100}%"></div><div class="cs-cap"></div></div>
        <div class="cs-scale" aria-hidden="true"></div></div>
      <output class="cs-val"></output>`;
    const cs = {
      g, i, el, cap: el.querySelector('.cs-cap'), track: el.querySelector('.cs-track'), cover: el.querySelector('.cs-meter .cover'),
      val: el.querySelector('.cs-val'), on: el.querySelector('.cs-on'), gain: el.querySelector('.cs-gain output span'),
      gunit: el.querySelector('.gunit'), grow: el.querySelector('.cs-gain'),
      num: el.querySelector('.cs-name b'), name: el.querySelector('.cs-name span'), link: el.querySelector('.cs-link'),
      scale: el.querySelector('.cs-scale'), scaleH: -1,
      dragging: false, holdUntil: 0, lastCover: -1, sendTimer: null,
    };
    // Fader: arrastre relativo (no salta al punto tocado). Deslizar en horizontal sigue desplazando la lista.
    const area = el.querySelector('.cs-fader');
    let startY = 0, startP = 0, startDb = 0, id = null;
    area.addEventListener('pointerdown', (e) => {
      if (locked) return lockedHint();
      id = e.pointerId; area.setPointerCapture(id);
      startY = e.clientY; startDb = data(cs).fader; startP = fpos(startDb);
      cs.dragging = true; el.classList.add('dragging'); touch();
    });
    area.addEventListener('pointermove', (e) => {
      if (!cs.dragging || e.pointerId !== id) return;
      const h = cs.track.clientHeight || 1;
      let db = fdb(Math.min(1, Math.max(0, startP - (e.clientY - startY) / h)));
      const maxAllowed = startDb !== -Infinity && startDb > faderLimit ? startDb : faderLimit;
      if (db > maxAllowed) db = maxAllowed;
      if (db === data(cs).fader) return;
      data(cs).fader = db;
      renderStrip(cs);
      sendThrottled(cs, 'fader', db);
      touch();
    });
    const end = (e) => {
      if (!cs.dragging || e.pointerId !== id) return;
      cs.dragging = false; el.classList.remove('dragging');
      cs.holdUntil = performance.now() + 700;
      flushSend(cs);
    };
    area.addEventListener('pointerup', end);
    area.addEventListener('pointercancel', end);

    cs.on.addEventListener('click', () => {
      if (locked) return lockedHint();
      const d = data(cs);
      d.on = !d.on; renderStrip(cs); send(cs, 'on', d.on); touch();
    });
    if (hasGain) {
      const step = (dir) => {
        const d = data(cs);
        if (d.gain != null && ctrl.caps.gain) {
          const nv = Math.min(ctrl.caps.gain.max, Math.max(ctrl.caps.gain.min, d.gain + dir * ctrl.caps.gain.step));
          if (nv === d.gain) return;
          d.gain = nv; renderStrip(cs); send(cs, 'gain', nv); touch();
          return;
        }
        const e = extState[cs.i];
        if (e) {
          if (!e.online || e.gain == null) return toast(t('toast.shureNoResp'));
          const nv = Math.min(42, Math.max(-18, e.gain + dir));
          if (nv === e.gain) return;
          e.gain = nv; renderStrip(cs); send(cs, 'ext', nv); touch();
          return;
        }
        toast(t('toast.noGain'));
      };
      [['.gup', 1], ['.gdn', -1]].forEach(([sel, dir]) => {
        const b = el.querySelector(sel);
        let rep, first;
        const stop = () => { clearTimeout(first); clearInterval(rep); };
        b.addEventListener('pointerdown', (e) => {
          if (locked) return lockedHint();
          e.preventDefault(); step(dir);
          first = setTimeout(() => { rep = setInterval(() => step(dir), 140); }, 450); // mantener pulsado repite
        });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => b.addEventListener(t, stop));
      });
    }
    cstrips.push(cs);
    return el;
  }

  const data = (cs) => ctrl[cs.g][cs.i];

  // =============== Capas del modo Control ===============
  const csKey = (cs) => `${cs.g}:${cs.i}`;
  const layerName = (g) => {
    const lg = lastLayout && lastLayout.groups.find((x) => x.id === g);
    return lg ? groupName(lg) : t('ly.' + g);
  };
  function availableLayers() { return [...CTRL_GROUPS.filter((g) => ctrl && ctrl[g].length), 'custom']; }
  function buildLayerBar() {
    const nav = $('layers');
    nav.innerHTML = availableLayers().map((g) => `<button data-layer="${g}">${esc(g === 'custom' ? t('ly.custom') : layerName(g))}</button>`).join('')
      + `<button class="edit" id="editCustom" aria-label="${esc(t('ly.edit'))}" title="${esc(t('ly.edit'))}">✎</button>`
      + `<span class="sep"></span><button class="stereo" id="toggleStereo" title="${esc(t('ly.showStereo'))}">${esc(ctrl.main.length === 2 ? t('main.one') + ' A/B' : t('main.one'))}</button>`;
    nav.querySelectorAll('[data-layer]').forEach((b) => b.onclick = () => { store.set('ctlLayer', b.dataset.layer); applyLayer(); });
    $('editCustom').onclick = openCustom;
    $('toggleStereo').onclick = () => { store.set('ctlStereo', !store.get('ctlStereo', true)); applyLayer(); };
  }
  function customList() {
    const valid = new Set(cstrips.map(csKey));
    return store.get('ctlCustom', []).filter((k) => valid.has(k));
  }
  // Muestra la capa elegida: sus tiras en la lista desplazable, en su orden (en Custom, el orden elegido).
  function applyLayer() {
    if (!ctrl) return;
    let layer = store.get('ctlLayer', 'ch');
    if (!availableLayers().includes(layer)) layer = 'ch';
    const showStereo = store.get('ctlStereo', true);
    const sc = $('cscroller'), pin = $('cpinned');
    sc.querySelector('.custom-empty')?.remove();
    const byKey = new Map(cstrips.map((cs) => [csKey(cs), cs]));
    if (layer === 'custom') {
      const list = customList();
      const inList = new Set(list);
      for (const cs of cstrips) {
        cs.el.hidden = !inList.has(csKey(cs));
        if (cs.g === 'main' && !inList.has(csKey(cs))) { pin.appendChild(cs.el); cs.el.hidden = false; }
      }
      for (const k of list) sc.appendChild(byKey.get(k).el);
      if (!list.length) sc.insertAdjacentHTML('beforeend', `<div class="custom-empty">${esc(t('ly.empty'))}</div>`);
    } else {
      for (const cs of cstrips) {
        if (cs.g === 'main') { pin.appendChild(cs.el); cs.el.hidden = false; continue; }
        sc.appendChild(cs.el); // orden natural
        cs.el.hidden = cs.g !== layer;
      }
    }
    pin.hidden = !showStereo || !pin.querySelector('.cs');
    $('layers').querySelectorAll('[data-layer]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.layer === layer)));
    $('toggleStereo').setAttribute('aria-pressed', String(showStereo));
    sc.scrollLeft = 0;
    requestAnimationFrame(() => cstrips.forEach((cs) => { if (!cs.el.hidden) renderStrip(cs); }));
  }
  // Elegir las tiras de la capa Custom (en el orden en que se tocan).
  function openCustom() {
    renderCustomPicker();
    $('customDlg').showModal();
  }
  function renderCustomPicker() {
    const list = customList();
    const groups = [...CTRL_GROUPS, 'main'].filter((g) => ctrl[g].length);
    $('cuCount').textContent = t('cu.count', { n: list.length });
    $('cuPicker').innerHTML = groups.map((g) => `<h4>${esc(g === 'main' ? t('main.one') : layerName(g))}</h4><div class="chips">`
      + cstrips.filter((cs) => cs.g === g).map((cs) => {
        const k = csKey(cs), n = list.indexOf(k);
        const label = `${cs.num.textContent}${cs.name.textContent ? ' ' + cs.name.textContent : ''}`;
        return `<button class="pick-chip" data-k="${k}" aria-pressed="${n >= 0}">${n >= 0 ? `<span class="ord">${n + 1}</span>` : ''}${esc(label)}</button>`;
      }).join('') + '</div>').join('');
    $('cuPicker').querySelectorAll('.pick-chip').forEach((b) => b.onclick = () => {
      const cur = customList(), k = b.dataset.k;
      store.set('ctlCustom', cur.includes(k) ? cur.filter((x) => x !== k) : [...cur, k]);
      const top = $('cuPicker').scrollTop;
      renderCustomPicker();
      $('cuPicker').scrollTop = top;
    });
  }
  $('cuClear').onclick = () => { store.set('ctlCustom', []); renderCustomPicker(); };
  $('cuDone').onclick = () => { $('customDlg').close(); store.set('ctlLayer', 'custom'); applyLayer(); };
  $('customDlg').addEventListener('close', applyLayer);

  // --- Receptores Shure
  let extState = {}, shureList = [], nics = [];
  // Adaptadores de red del Mac: "Automático" deja que decida el sistema; si no, el receptor se conecta por ese.
  function fillNics() {
    const sel = $('shNic'), keep = sel.value;
    sel.innerHTML = `<option value="">${esc(t('sh.nicAuto'))}</option>` + nics.map((n) => `<option value="${esc(n.name)}">${esc(n.name)}${n.wifi ? ' · wifi' : ''} · ${esc(n.address)}</option>`).join('');
    sel.value = nics.some((n) => n.name === keep) ? keep : '';
  }
  function onNics(m) { nics = m.list || []; fillNics(); renderShureList(); }
  const askNics = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'nics' })); };
  $('shNic').addEventListener('focus', askNics);
  $('openSettings').addEventListener('click', askNics);
  let shureOnline = [];
  function renderShureList() {
    $('shureList').innerHTML = '';
    shureList.forEach((r, k) => {
      const li = document.createElement('li');
      const maps = Object.entries(r.map).map(([rx, ch]) => `${rx}→${[].concat(ch).join('+')}`).join(', ');
      const gone = r.nic && !nics.some((n) => n.name === r.nic);
      const nic = r.nic ? ` · ${esc(r.nic)}${gone ? ` (${esc(t('sh.nicGone'))})` : ''}` : '';
      li.innerHTML = `<i class="dot${shureOnline[k] ? ' on' : ''}"></i><span>${esc(r.ip)}${nic} · ${t('sh.channels')} ${esc(maps)}</span><button>${t('sh.remove')}</button>`;
      li.querySelector('button').onclick = () => {
        if (!confirm(t('sh.confirmRemove', { ip: r.ip }))) return;
        ws.send(JSON.stringify({ type: 'shure-set', list: shureList.filter((_, j) => j !== k) }));
      };
      $('shureList').appendChild(li);
    });
  }
  function onShure(m) {
    extState = m.ext || {};
    shureList = m.list || [];
    shureOnline = m.online || [];
    if (m.nics) { nics = m.nics; fillNics(); }
    $('shErr').textContent = '';
    renderShureList();
    cstrips.forEach(renderStrip);
  }
  $('shAdd').onclick = () => {
    const ip = $('shIp').value.trim();
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { $('shErr').textContent = t('err.ipForm', { ex: '192.168.0.50' }); return; }
    const map = {};
    for (let k = 1; k <= 4; k++) {
      const v = $('shC' + k).value.trim();
      if (!v) continue;
      // Uno o varios canales de la mesa para la misma entrada del receptor: "25" o "25, 60".
      const nums = [...new Set(v.split(/[,\s]+/).filter(Boolean).map(Number))];
      const bad = nums.find((n) => !Number.isInteger(n) || n < 1);
      if (bad !== undefined || !nums.length) { $('shErr').textContent = t('sh.errChannel', { v }); return; }
      const ha = nums.find((n) => { const d = ctrl && ctrl.ch[n - 1]; return d && d.gain != null; });
      if (ha !== undefined) { $('shErr').textContent = t('sh.errHasHa', { n: ha }); return; }
      map[k] = nums.length === 1 ? nums[0] : nums;
    }
    if (!Object.keys(map).length) { $('shErr').textContent = t('sh.errNone'); return; }
    const nic = $('shNic').value;
    ws.send(JSON.stringify({ type: 'shure-set', list: [...shureList.filter((r) => r.ip !== ip), { ip, map, ...(nic ? { nic } : {}) }] }));
    ['shIp', 'shC1', 'shC2', 'shC3', 'shC4'].forEach((id) => { $(id).value = ''; });
  };

  // Marcas de la escala, por orden de importancia: si el fader es bajo, solo caben las primeras.
  const SCALE_MARKS = [0, -10, 10, -20, -30, 5, -5, -40, -60, -Infinity];
  const SCALE_TEXT = (v) => (v === -Infinity ? '−∞' : v > 0 ? `+${v}` : v < 0 ? `−${-v}` : '0');
  function layoutScale(cs) {
    const h = cs.track.clientHeight;
    if (!h || h === cs.scaleH) return;
    cs.scaleH = h;
    const chosen = [];
    for (const v of SCALE_MARKS) {
      const y = fpos(v) * h;
      if (chosen.every((c) => Math.abs(c.y - y) >= 12)) chosen.push({ v, y });
    }
    cs.scale.innerHTML = chosen
      .map(({ v }) => `<span class="${v === 0 ? 'z' : ''}" style="bottom:${fpos(v) * 100}%">${SCALE_TEXT(v)}</span>`)
      .join('');
    // Rayas sobre el recorrido del fader a la altura de cada marca (el 0 ya tiene su línea).
    cs.track.querySelectorAll('.tk').forEach((x) => x.remove());
    for (const { v } of chosen) {
      if (v === 0 || v === -Infinity) continue;
      const tk = document.createElement('i');
      tk.className = 'tk';
      tk.style.bottom = `${fpos(v) * 100}%`;
      cs.track.insertBefore(tk, cs.cap);
    }
  }

  function renderStrip(cs) {
    layoutScale(cs);
    const d = data(cs);
    const p = fpos(d.fader);
    cs.cap.style.transform = `translateY(${(1 - p) * cs.track.clientHeight}px)`;
    cs.val.textContent = fmtDb(d.fader);
    cs.on.setAttribute('aria-pressed', String(!!d.on));
    if (cs.g === 'ch') {
      const e = d.gain == null ? extState[cs.i] : null;
      cs.gain.textContent = e ? (e.online && e.gain != null ? fmtGain(e.gain) : '—') : fmtGain(d.gain);
      cs.gunit.textContent = e ? 'SHURE' : 'dB';
      cs.grow.classList.toggle('ext', !!e);
      cs.gain.title = e ? t(e.online ? 'gain.shureTitle' : 'gain.shureOff') : '';
      cs.el.classList.toggle('nogain', !ctrl.caps.gain && !e);
    }
    const tags = [d.stereo ? 'ST' : '', d.link ? `L${d.link}` : ''].filter(Boolean);
    cs.link.hidden = !tags.length;
    cs.link.textContent = tags.join(' ');
    cs.link.title = [d.stereo ? t('link.stereo') : '', d.link ? t('link.group', { n: d.link }) : ''].filter(Boolean).join(' · ');
  }

  function relabelControl() {
    if (!ctrl) return;
    const grp = (id) => lastLayout && lastLayout.groups.find((g) => g.id === id);
    for (const cs of cstrips) {
      if (cs.g !== 'main') {
        const s = grp(cs.g) && grp(cs.g).strips[cs.i];
        cs.num.textContent = cs.g === 'ch' ? String(cs.i + 1) : (s && s.num) || `${cs.g === 'bus' ? 'MX' : 'MT'}${cs.i + 1}`;
        cs.name.textContent = (s && s.name) || '';
      } else {
        cs.num.textContent = 'ST';
        cs.name.textContent = ctrl.main.length === 2 ? t(cs.i === 0 ? 'main.a' : 'main.b') : t('main.one');
      }
    }
  }

  // Medidores que acompañan a cada tira de control.
  function meterSources(cs) {
    if (!lastLayout) return [];
    const gi = lastLayout.groups.findIndex((g) => g.id === cs.g);
    if (gi < 0) return [];
    if (cs.g !== 'main') return [strips[groupStart[gi] + cs.i]].filter(Boolean);
    const n = lastLayout.groups[gi].strips.length, per = Math.max(1, Math.floor(n / ctrl.main.length));
    return Array.from({ length: per }, (_, k) => strips[groupStart[gi] + cs.i * per + k]).filter(Boolean);
  }

  function onParam(m) {
    if (m.key === 'ext') {
      extState[m.i] = m.value;
      const cs = cstrips.find((c) => c.g === 'ch' && c.i === m.i);
      if (cs) renderStrip(cs);
      return;
    }
    if (!ctrl || !ctrl[m.g] || !ctrl[m.g][m.i]) return;
    const cs = cstrips.find((c) => c.g === m.g && c.i === m.i);
    if (m.key === 'fader' && cs && (cs.dragging || performance.now() < cs.holdUntil)) return; // el dedo manda
    ctrl[m.g][m.i][m.key] = m.key === 'fader' ? fromWire(m.value) : m.value;
    if (cs) renderStrip(cs);
  }

  function send(cs, key, value) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'set', g: cs.g, i: cs.i, key, value: toWire(value) }));
  }
  function sendThrottled(cs, key, value) {
    cs.pending = [key, value];
    if (cs.sendTimer) return;
    cs.sendTimer = setTimeout(() => flushSend(cs), 40);
  }
  function flushSend(cs) {
    clearTimeout(cs.sendTimer); cs.sendTimer = null;
    if (cs.pending) { send(cs, cs.pending[0], cs.pending[1]); cs.pending = null; }
  }

  function setMode(m, save = true) {
    mode = m === 'control' && ctrl && canControl ? 'control' : 'meters';
    document.body.dataset.mode = mode;
    $('modes').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    $('lockBtn').hidden = mode !== 'control';
    if (save) store.set('mode', mode);
    if (mode === 'control') applyLayer();
  }
  $('modes').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  function setLocked(v) {
    locked = v;
    document.body.classList.toggle('locked', v);
    $('lockBtn').setAttribute('aria-pressed', String(v));
    $('lockBtn').setAttribute('aria-label', t(v ? 'a.unlock' : 'a.lock'));
    $('lockShackle').setAttribute('d', v ? 'M8 11V8a4 4 0 0 1 8 0v3' : 'M8 11V8a4 4 0 0 1 7.5-2');
    if (!v) touch(); else clearTimeout(lockTimer);
  }
  function touch() {
    clearTimeout(lockTimer);
    if (autolock && !locked) lockTimer = setTimeout(() => { setLocked(true); toast(t('toast.lockedIdle')); }, 120000);
  }
  function lockedHint() { toast(t('toast.lockedHint')); }
  $('lockBtn').onclick = () => { setLocked(!locked); toast(t(locked ? 'toast.locked' : 'toast.unlocked')); };
  setLocked(true);

  $('optLimit').value = String(faderLimit);
  $('optLimit').onchange = () => { faderLimit = Number($('optLimit').value); store.set('limit', faderLimit); };
  $('optAutolock').checked = autolock;
  $('optAutolock').onchange = () => { autolock = $('optAutolock').checked; store.set('autolock', autolock); touch(); };
  window.addEventListener('resize', () => cstrips.forEach(renderStrip));

  // =============== Registro del bolo ===============
  let clipEvents = [], clipInit = false, histData = null, histTimer = null;
  // Canales elegidos para la gráfica (se guardan en cada móvil). "main" = salida principal.
  const MAX_SEL = 6;
  const SEL_COLORS = ['#f1b43b', '#72c2dc', '#b39af3', '#e49fc6', '#8fd6a8', '#f08a4b'];
  let histSel = store.get('histSel', ['main']);
  const keyOf = (st) => `${st.gid}:${st.idx}`;
  function keyLabel(key) {
    if (key === 'main') {
      const g = lastLayout && lastLayout.groups.find((x) => x.id === 'main');
      return g ? groupName(g) : 'Main';
    }
    const [gid, i] = key.split(':');
    const st = strips.find((x) => x.gid === gid && x.idx === Number(i));
    return st ? st.label : key;
  }
  // Solo los canales que existen en la mesa actual.
  function activeSel() {
    const hasMain = lastLayout && lastLayout.groups.some((g) => g.id === 'main');
    const ok = histSel.filter((k) => (k === 'main' ? hasMain : strips.some((st) => keyOf(st) === k)));
    return ok.length ? ok : hasMain ? ['main'] : strips[0] ? [keyOf(strips[0])] : [];
  }
  const seenKey = 'clipSeen';
  const fmtClock = (ms) => new Date(ms).toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const fmtNum = (v) => (v > 0 ? '+' : '') + v.toFixed(1);

  function onClipLog(events) {
    const lastT = clipEvents.length ? clipEvents[clipEvents.length - 1].t : 0;
    // Aviso de las saturaciones nuevas (no al cargar la página).
    if (clipInit) for (const e of events) if (e.t > lastT) toast(t('clip.toast', { label: e.label, v: fmtNum(e.peak) }));
    clipEvents = events;
    clipInit = true;
    updateBadge();
    if ($('report').open) renderClipList();
  }
  function updateBadge() {
    const seen = store.get(seenKey, 0);
    const n = clipEvents.filter((e) => e.t > seen).length;
    $('reportBadge').hidden = !n || $('report').open;
    $('reportBadge').textContent = n > 99 ? '99+' : String(n);
  }
  function renderClipList() {
    const seen = store.get(seenKey, 0);
    const ul = $('clipList');
    let events = clipEvents;
    if ($('clipFilter').checked) {
      const sel = new Set(activeSel());
      events = clipEvents.filter((e) => sel.has(`${e.g}:${e.i}`) || (e.g === 'main' && sel.has('main')));
    }
    if (!events.length) { ul.innerHTML = `<li><span class="empty-row">${esc(t('rep.noClips'))}</span></li>`; return; }
    ul.innerHTML = events.slice().reverse().map((e) =>
      `<li class="${e.t > seen ? 'new' : ''}"><time>${fmtClock(e.t)}</time><span>${esc(e.label)}</span><b>${fmtNum(e.peak)} dB</b></li>`).join('');
  }
  function openReport() {
    $('clipFilter').checked = store.get('clipFilter', false);
    renderClipList();
    $('picker').hidden = true;
    renderSelRow();
    const dlg = $('report');
    if (REPORT_ONLY) dlg.show();
    else if (desktop()) { dlg.classList.add('floating'); dlg.show(); placeReport(); }
    else { dlg.classList.remove('floating'); dlg.showModal(); }
    $('repPopout').hidden = REPORT_ONLY || !desktop();
    drawHistory();
    // Marcar como vistas después de pintarlas (así se ven resaltadas esta vez).
    store.set(seenKey, clipEvents.length ? clipEvents[clipEvents.length - 1].t : Date.now());
    updateBadge();
    askHistory();
    histTimer = setInterval(askHistory, 5000);
  }
  function askHistory() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'history-get', keys: activeSel() })); }
  $('clipFilter').onchange = () => { store.set('clipFilter', $('clipFilter').checked); renderClipList(); };

  // Fila de canales elegidos (con su color) y botón para cambiarlos.
  function renderSelRow() {
    const sel = activeSel();
    const row = $('selRow');
    row.innerHTML = sel.map((k, n) => `<span class="sel-chip"><i style="background:${SEL_COLORS[n]}"></i>${esc(keyLabel(k))}</span>`).join('')
      + `<button class="sel-chip sel-edit" id="selEdit">${esc(t('rep.choose'))}</button>`;
    $('selEdit').onclick = togglePicker;
    $('histCsv').href = `historial.csv?c=${encodeURIComponent(sel.join(','))}`;
  }
  function togglePicker() {
    const pk = $('picker');
    if (!pk.hidden) { pk.hidden = true; return; }
    const sel = new Set(activeSel());
    let html = '';
    if (lastLayout && lastLayout.groups.some((g) => g.id === 'main')) {
      html += `<h4>${esc(t('rep.output'))}</h4><div class="chips"><button class="pick-chip" data-k="main" aria-pressed="${sel.has('main')}">${esc(keyLabel('main'))}</button></div>`;
    }
    for (const g of (lastLayout ? lastLayout.groups : [])) {
      const members = strips.filter((st) => st.gid === g.id);
      if (!members.length) continue;
      html += `<h4>${esc(groupName(g))}</h4><div class="chips">` + members.map((st) =>
        `<button class="pick-chip" data-k="${keyOf(st)}" aria-pressed="${sel.has(keyOf(st))}">${esc(st.label)}</button>`).join('') + '</div>';
    }
    html += `<button class="done" id="pickDone">${esc(t('rep.done'))}</button>`;
    pk.innerHTML = html;
    pk.hidden = false;
    pk.querySelectorAll('.pick-chip').forEach((b) => b.onclick = () => {
      const k = b.dataset.k, cur = activeSel();
      if (cur.includes(k)) {
        if (cur.length === 1) return; // siempre al menos un canal
        histSel = cur.filter((x) => x !== k);
      } else {
        if (cur.length >= MAX_SEL) return toast(t('rep.max', { n: MAX_SEL }));
        histSel = [...cur, k];
      }
      store.set('histSel', histSel);
      b.setAttribute('aria-pressed', String(histSel.includes(k)));
      renderSelRow();
      renderClipList();
      histData = null; drawHistory(); askHistory();
    });
    $('pickDone').onclick = () => { pk.hidden = true; };
  }
  $('reportBtn').onclick = openReport;
  $('closeReport').onclick = () => {
    if (!REPORT_ONLY) return $('report').close();
    window.close();
    setTimeout(() => { location.href = location.pathname; }, 150); // si el navegador no deja cerrarla
  };
  // Ordenador con ratón y pantalla amplia: panel flotante. Móvil: ventana normal.
  function desktop() { return matchMedia('(pointer: fine)').matches && innerWidth >= 800; }
  function placeReport() {
    const dlg = $('report');
    const saved = store.get('reportPos', null);
    const w = dlg.offsetWidth, h = dlg.offsetHeight;
    let x = saved ? saved.x : (innerWidth - w) / 2, y = saved ? saved.y : Math.max(20, (innerHeight - h) / 2);
    x = Math.min(Math.max(0, x), Math.max(0, innerWidth - w)); y = Math.min(Math.max(0, y), Math.max(0, innerHeight - 60));
    dlg.style.left = `${x}px`; dlg.style.top = `${y}px`;
  }
  (() => {
    const head = $('repHead'), dlg = $('report');
    let sx = 0, sy = 0, ox = 0, oy = 0, drag = false;
    head.addEventListener('pointerdown', (e) => {
      if (!dlg.classList.contains('floating') || e.target.closest('button')) return;
      drag = true; head.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY; ox = dlg.offsetLeft; oy = dlg.offsetTop;
    });
    head.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const x = Math.min(Math.max(-dlg.offsetWidth + 120, ox + e.clientX - sx), innerWidth - 120);
      const y = Math.min(Math.max(0, oy + e.clientY - sy), innerHeight - 50);
      dlg.style.left = `${x}px`; dlg.style.top = `${y}px`;
    });
    const end = () => { if (!drag) return; drag = false; store.set('reportPos', { x: dlg.offsetLeft, y: dlg.offsetTop }); };
    head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && dlg.open && dlg.classList.contains('floating')) dlg.close(); });
    window.addEventListener('resize', () => { if (dlg.open) { if (dlg.classList.contains('floating')) placeReport(); drawHistory(); } });
  })();
  // Abrir el registro en una ventana independiente del navegador (se puede llevar a otra pantalla).
  $('repPopout').onclick = () => {
    const win = window.open(`${location.pathname}?vista=registro`, 'medidores-registro', 'popup,width=920,height=760');
    if (win) { $('report').close(); win.focus(); }
  };
  $('report').addEventListener('close', () => { clearInterval(histTimer); updateBadge(); });
  $('clearLog').onclick = () => { if (confirm(t('confirm.clearLog'))) ws.send(JSON.stringify({ type: 'clip-log-clear' })); };
  $('clearHistory').onclick = () => { if (confirm(t('confirm.clearHistory'))) ws.send(JSON.stringify({ type: 'history-clear' })); };

  // Gráfica de nivel, de −60 a 0 dB. Un canal: pico (ámbar) y media (verde). Varios: el pico de cada uno, con su color.
  const H_MIN = -60, H_MAX = 0, PAD_L = 30;
  function chartSeries() {
    const sel = activeSel();
    if (!histData || !histData.t || histData.t.length < 2) return { sel, lines: [] };
    const keys = sel.filter((k) => histData.series && histData.series[k]);
    if (keys.length === 1) {
      const sr = histData.series[keys[0]];
      return { sel, single: true, lines: [
        { key: keys[0], what: 'avg', color: getComputedStyle(document.documentElement).getPropertyValue('--sig').trim(), data: sr.avg },
        { key: keys[0], what: 'peak', color: '#f1b43b', data: sr.peak }] };
    }
    return { sel, lines: keys.map((k) => ({ key: k, what: 'peak', color: SEL_COLORS[sel.indexOf(k)], data: histData.series[k].peak })) };
  }
  function drawHistory() {
    const cv = $('histChart'), dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w) return;
    cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    const col = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const pw = w - PAD_L - 6, ph = h - 18 - 6;
    const y = (db) => 6 + ph * (1 - (Math.max(H_MIN, Math.min(H_MAX, db)) - H_MIN) / (H_MAX - H_MIN));
    c.font = '11px system-ui, sans-serif';
    c.fillStyle = col('--muted'); c.strokeStyle = col('--line'); c.lineWidth = 1;
    for (const db of [0, -6, -12, -18, -24, -36, -48, -60]) {
      c.beginPath(); c.moveTo(PAD_L, y(db) + .5); c.lineTo(w - 6, y(db) + .5); c.stroke();
      c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(String(db), PAD_L - 5, y(db));
    }
    const { lines, single } = chartSeries();
    // Leyenda
    $('chartLegend').innerHTML = single
      ? `<span><i style="background:#f1b43b"></i>${esc(t('rep.peak'))}</span><span><i style="background:${col('--sig')}"></i>${esc(t('rep.avg'))}</span>`
      : ''; // con varios canales, los colores ya están en las etiquetas de arriba
    const read = $('chartRead');
    if (!lines.length) {
      c.textAlign = 'center'; c.fillStyle = col('--muted');
      c.fillText(t(histData ? 'rep.noHistory' : 'empty.connecting'), PAD_L + pw / 2, 6 + ph / 2);
      read.textContent = ''; return;
    }
    const T = histData.t, t0 = T[0], t1 = T[T.length - 1], span = Math.max(1, t1 - t0);
    const x = (tt) => PAD_L + pw * (tt - t0) / span;
    const gapLimit = Math.max(5, (span / T.length) * 3); // hueco en los datos (mesa desconectada): se corta la línea
    for (const l of lines) {
      c.strokeStyle = l.color; c.lineWidth = 1.5; c.beginPath();
      let drawing = false;
      l.data.forEach((v, k) => {
        if (v == null || (k && T[k] - T[k - 1] > gapLimit)) { drawing = false; if (v == null) return; }
        const px = x(T[k]), py = y(v);
        drawing ? c.lineTo(px, py) : c.moveTo(px, py);
        drawing = true;
      });
      c.stroke();
    }
    c.fillStyle = col('--muted'); c.textBaseline = 'alphabetic';
    const lbl = (tt) => new Date(tt * 1000).toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit' });
    c.textAlign = 'left'; c.fillText(lbl(t0), PAD_L, h - 3);
    c.textAlign = 'right'; c.fillText(lbl(t1), w - 6, h - 3);
    if (t1 - t0 > 600) { c.textAlign = 'center'; c.fillText(lbl((t0 + t1) / 2), PAD_L + pw / 2, h - 3); }
    if (!read.dataset.pinned) showReading(T.length - 1);
  }
  // Texto con los valores de un instante de la gráfica.
  function showReading(k) {
    const { lines, single } = chartSeries();
    if (!lines.length) return;
    const tt = histData.t[k];
    const v = (arr) => (arr[k] == null ? '—' : `${fmtNum(arr[k])} dB`);
    const parts = single
      ? [`${t('rep.peak')} ${v(lines[1].data)}`, `${t('rep.avg')} ${v(lines[0].data)}`]
      : lines.map((l) => `${keyLabel(l.key)} ${v(l.data)}`);
    $('chartRead').textContent = `${fmtClock(tt * 1000)} · ${parts.join(' · ')}`;
  }
  // Tocar o arrastrar sobre la gráfica muestra los valores de ese momento.
  (() => {
    const cv = $('histChart'), read = $('chartRead');
    const show = (e) => {
      if (!histData || !histData.t || histData.t.length < 2) return;
      const r = cv.getBoundingClientRect(), pw = r.width - PAD_L - 6;
      const f = Math.max(0, Math.min(1, (e.clientX - r.left - PAD_L) / pw));
      const T = histData.t, tt = T[0] + f * (T[T.length - 1] - T[0]);
      let best = 0;
      for (let k = 1; k < T.length; k++) if (Math.abs(T[k] - tt) < Math.abs(T[best] - tt)) best = k;
      read.dataset.pinned = '1';
      showReading(best);
    };
    cv.addEventListener('pointerdown', show);
    cv.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') show(e); });
    $('report').addEventListener('close', () => { delete read.dataset.pinned; });
  })();

  // =============== Vista grande: un canal o todo su grupo ===============
  // Canales vinculados al tocado: su grupo de link y su pareja estéreo (y los de esa pareja).
  function linkedChannels(i) {
    if (!ctrl || !ctrl.ch[i]) return [i];
    const out = new Set([i]);
    let grew = true;
    while (grew) {
      grew = false;
      for (const k of [...out]) {
        const c = ctrl.ch[k];
        if (!c) continue;
        const add = [];
        if (c.pair >= 0) add.push(c.pair);
        if (c.link) ctrl.ch.forEach((o, j) => { if (o.link === c.link) add.push(j); });
        for (const j of add) if (!out.has(j)) { out.add(j); grew = true; }
      }
    }
    return [...out].sort((a, b) => a - b);
  }

  let bigCards = [], bigLastText = 0;
  function openBig(st) {
    let members = [st];
    if (st.gid === 'ch') {
      const gi = lastLayout ? lastLayout.groups.findIndex((g) => g.id === 'ch') : -1;
      if (gi >= 0) members = linkedChannels(st.idx).map((j) => strips[groupStart[gi] + j]).filter(Boolean);
      if (!members.length) members = [st];
    }
    const grid = $('bigGrid');
    grid.innerHTML = '';
    grid.classList.toggle('one', members.length === 1);
    bigCards = members.map((m) => {
      const card = document.createElement('div');
      card.className = 'big-card';
      card.innerHTML = `<div class="big-meter"><div class="cover"></div><div class="hold"></div></div>
        <div class="big-info"><div class="big-name"></div><div class="big-val"></div>
        <div class="big-peak"><span>${esc(t('big.peak'))}</span> <span class="pk"></span></div>
        <div><span class="big-clip" hidden>CLIP</span></div></div>`;
      card.querySelector('.big-name').textContent = m.label;
      grid.appendChild(card);
      return { st: m, cover: card.querySelector('.cover'), hold: card.querySelector('.hold'),
        val: card.querySelector('.big-val'), pk: card.querySelector('.pk'), clip: card.querySelector('.big-clip') };
    });
    layoutBig();
    $('big').hidden = false;
    bigLastText = 0;
  }
  // Reparto: en vertical, apiladas (una columna hasta 4 canales); en horizontal, en fila (hasta 4 por fila).
  function layoutBig() {
    const n = bigCards.length;
    if (!n) return;
    const landscape = innerWidth > innerHeight;
    const cols = landscape ? Math.min(n, 4) : n <= 4 ? 1 : 2;
    const rows = Math.ceil(n / cols);
    $('bigGrid').style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    $('bigGrid').style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
  }
  window.addEventListener('resize', layoutBig);
  function closeBig() { bigCards = []; $('big').hidden = true; }
  $('big').addEventListener('click', closeBig);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && bigCards.length) closeBig(); });
  function renderBig(now) {
    const text = now - bigLastText > 120; // cifras a ~8 por segundo para que se puedan leer
    if (text) bigLastText = now;
    for (const c of bigCards) {
      const st = c.st;
      c.cover.style.transform = `scaleY(${1 - pos(st.disp)})`;
      c.hold.style.transform = `translateY(${(1 - pos(st.peak)) * 100}%)`;
      c.hold.style.display = holdForever ? '' : 'none';
      if (text) {
        c.val.innerHTML = `${st.target <= -89 ? '−∞' : fmtNum(st.target)}<small>dB</small>`;
        c.pk.textContent = st.maxSeen <= -89 ? '—' : `${fmtNum(st.maxSeen)} dB`;
        c.clip.hidden = !st.clip;
      }
    }
  }

  // =============== Mensajes y line check (compartidos entre sala y escenario) ===============
  const MSG_KEYS = ['msg.ready', 'msg.battery', 'msg.cable', 'msg.noSignal', 'msg.noise', 'msg.come', 'msg.wait', 'msg.ok'];
  const myIds = new Set(); // mensajes enviados desde este móvil (por su identificador)
  let msgs = [], linkWs = null, linkOk = ROLE === 'sala', lcState = { active: false, items: [] };
  const myName = () => store.get('name', '');
  const msgText = (m) => (m.key ? t(m.key) : m.text);
  const whoText = (from, name) => t('msgs.from.' + from) + (name ? ` · ${name}` : '');

  // En escenario, los mensajes y el line check van por el enlace con la app de sala (puerto 3000 del mismo ordenador).
  function sendShared(obj) {
    const sock = ROLE === 'sala' ? ws : linkWs;
    if (sock && sock.readyState === 1) { sock.send(JSON.stringify(obj)); return true; }
    toast(t('msgs.linkOff'));
    return false;
  }
  function connectLink() {
    if (ROLE !== 'escenario') return;
    const host = store.get('salaHost', '') || `${location.hostname}:3000`;
    try { linkWs = new WebSocket(`ws://${host}/enlace`); } catch { linkWs = null; }
    if (!linkWs) return setTimeout(connectLink, 3000);
    linkWs.onopen = () => { linkOk = true; renderLinkState(); };
    linkWs.onmessage = (e) => { try { onShared(JSON.parse(e.data)); } catch {} };
    linkWs.onclose = () => { linkOk = false; renderLinkState(); setTimeout(connectLink, 3000); };
  }
  function renderLinkState() {
    const el = $('msgLink');
    el.hidden = ROLE === 'sala';
    el.classList.toggle('off', !linkOk);
    el.textContent = t(linkOk ? 'msgs.linkOn' : 'msgs.linkOff');
  }

  function onShared(m) {
    if (m.type === 'msgs') { msgs = m.list || []; renderMsgs(); updateMsgBadge(); return true; }
    if (m.type === 'msg') {
      msgs.push(m.m); if (msgs.length > 60) msgs.shift();
      if (!myIds.has(m.m.cid)) showBanner(m.m);
      renderMsgs(); updateMsgBadge();
      return true;
    }
    if (m.type === 'msg-ack') {
      const x = msgs.find((y) => y.id === m.id);
      if (x) { x.acks = m.acks; renderMsgs(); }
      return true;
    }
    if (m.type === 'lc') { lcState = m; renderLc(); return true; }
    return false;
  }

  // --- Aviso grande de mensaje recibido, hasta pulsar "Visto"
  const pending = [];
  function showBanner(m) {
    pending.push(m);
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
    renderBanner();
  }
  function renderBanner() {
    const m = pending[0];
    $('msgBanner').hidden = !m;
    if (!m) return;
    $('bannerWho').textContent = `${whoText(m.from, m.name)} · ${fmtClock(m.t)}${pending.length > 1 ? ` · +${pending.length - 1}` : ''}`;
    $('bannerTxt').innerHTML = `${esc(msgText(m))}${m.ch ? `<span class="ch">${esc(m.ch)}</span>` : ''}`;
  }
  $('bannerOk').onclick = () => {
    const m = pending.shift();
    if (m) sendShared({ type: 'msg-ack', id: m.id, from: ROLE, name: myName() });
    renderBanner(); updateMsgBadge();
  };

  // --- Ventana de mensajes
  function updateMsgBadge() {
    const n = pending.length;
    $('msgBadge').hidden = !n;
    $('msgBadge').textContent = String(n);
  }
  function renderMsgs() {
    const ul = $('msgList');
    if (!msgs.length) { ul.innerHTML = `<li class="empty-row">${esc(t('msgs.empty'))}</li>`; return; }
    ul.innerHTML = msgs.slice(-40).map((m) => {
      const mine = myIds.has(m.cid);
      const acks = (m.acks || []).map((a) => whoText(a.from, a.name)).join(', ');
      return `<li class="${mine ? 'mine' : ''}"><div class="meta"><span>${esc(whoText(m.from, m.name))}</span><time>${fmtClock(m.t)}</time></div>
        <div class="body">${m.ch ? `<b>${esc(m.ch)}</b>` : ''}${esc(msgText(m))}</div>
        ${acks ? `<div class="ack">✓ ${esc(t('msgs.seenBy', { who: acks }))}</div>` : ''}</li>`;
    }).join('');
    ul.scrollTop = ul.scrollHeight;
  }
  function fillChannels(pre) {
    const sel = $('msgCh');
    const opts = [`<option value="">${esc(t('msgs.noChannel'))}</option>`];
    for (const st of strips) if (st.gid === 'ch') opts.push(`<option>${esc(st.label)}</option>`);
    sel.innerHTML = opts.join('');
    sel.value = pre || '';
  }
  function openMsgs(preChannel) {
    fillChannels(preChannel);
    renderLinkState(); renderMsgs();
    $('msgQuick').innerHTML = MSG_KEYS.map((k) => `<button data-k="${k}">${esc(t(k))}</button>`).join('');
    $('msgQuick').querySelectorAll('button').forEach((b) => b.onclick = () => sendMsg({ key: b.dataset.k }));
    if (!$('msgDlg').open) $('msgDlg').showModal();
  }
  function sendMsg(body) {
    const cid = Math.random().toString(36).slice(2, 10);
    myIds.add(cid);
    if (sendShared({ type: 'msg-send', from: ROLE, name: myName(), ch: $('msgCh').value, cid, ...body })) {
      $('msgText').value = '';
      $('msgCh').value = ''; // el siguiente mensaje empieza sin canal, para no repetir uno por error
      toast(t('msgs.sent'));
    }
  }
  $('msgBtn').onclick = () => openMsgs();
  $('closeMsgs').onclick = () => $('msgDlg').close();
  $('msgSend').onclick = () => { const v = $('msgText').value.trim(); if (v) sendMsg({ text: v }); };
  $('msgText').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('msgSend').click(); });

  // --- Line check
  let lcRows = [];
  function renderLc() {
    if (!$('lcDlg').open) return;
    const items = lcState.items || [];
    const ok = items.filter((x) => x.ok).length, noisy = items.filter((x) => x.noise).length;
    $('lcStart').textContent = t(items.length ? 'lc.restart' : 'lc.start');
    $('lcStop').hidden = !lcState.active;
    $('lcProg').innerHTML = items.length
      ? `${esc(t('lc.progress', { ok, n: items.length }))}${noisy ? `<small>${esc(t('lc.noiseCount', { n: noisy }))}</small>` : ''}`
      : '';
    $('lcHint').textContent = !items.length ? t('lc.idle') : lcState.active ? t('lc.tapHint') : t('lc.finished');
    const ul = $('lcList');
    if (lcRows.length !== items.length) {
      ul.innerHTML = '';
      lcRows = items.map(() => {
        const li = document.createElement('li');
        li.innerHTML = '<span class="nm"></span><span class="lvl"><i></i></span><span class="st"></span>';
        li.onclick = () => { $('lcDlg').close(); openMsgs(li.dataset.label); };
        ul.appendChild(li);
        return { li, nm: li.querySelector('.nm'), bar: li.querySelector('.lvl i'), st: li.querySelector('.st') };
      });
    }
    const onlyPending = $('lcPending').checked;
    items.forEach((it, k) => {
      const r = lcRows[k];
      r.li.dataset.label = it.label;
      r.nm.textContent = it.label;
      r.bar.style.width = `${Math.round(pos(lcState.active ? it.level : -90) * 100)}%`;
      r.li.classList.toggle('ok', it.ok);
      r.li.classList.toggle('noise', it.noise);
      r.st.textContent = [it.ok ? `✓ ${fmtNum(it.peak)} dB` : '', it.noise ? `⚠ ${t('lc.noise')}` : '', !it.ok && !it.noise ? t('lc.pending') : ''].filter(Boolean).join(' · ');
      r.li.hidden = onlyPending && it.ok && !it.noise;
    });
    const missing = items.filter((x) => !x.ok).map((x) => x.label.split(' ')[0]);
    $('lcSum').textContent = items.length && !lcState.active ? t('lc.missing', { list: missing.length ? missing.join(', ') : t('lc.none') }) : '';
  }
  $('openLc').onclick = () => {
    if (ROLE === 'escenario' && !linkOk) return toast(t('msgs.linkOff'));
    dlg.close();
    $('lcPending').checked = store.get('lcPending', false);
    $('lcDlg').showModal();
    lcRows = []; renderLc();
  };
  $('lcStart').onclick = () => { sendShared({ type: 'lc-start' }); };
  $('lcStop').onclick = () => { sendShared({ type: 'lc-stop' }); };
  $('lcPending').onchange = () => { store.set('lcPending', $('lcPending').checked); renderLc(); };
  $('closeLc').onclick = () => $('lcDlg').close();

  // --- Ajustes: nombre y dirección de la app de sala
  $('optName').value = myName();
  $('optName').onchange = () => store.set('name', $('optName').value.trim());
  $('salaHostRow').hidden = ROLE !== 'escenario';
  $('optSalaHost').value = store.get('salaHost', '') || `${location.hostname}:3000`;
  $('optSalaHost').onchange = () => {
    const v = $('optSalaHost').value.trim();
    store.set('salaHost', v === `${location.hostname}:3000` ? '' : v);
    if (linkWs) linkWs.close(); // reconecta con la nueva dirección
  };
  if (ROLE === 'escenario') { $('reportBtn').hidden = true; connectLink(); }
  renderLinkState();

  // --- Idioma (se guarda en cada móvil; al cambiarlo se recarga la página)
  for (const sel of [$('optLang'), $('setupLang')]) {
    sel.innerHTML = Object.entries(LANGS).map(([code, name]) => `<option value="${code}">${name}</option>`).join('');
    sel.value = LANG;
    sel.onchange = () => {
      try { localStorage.setItem('medidores:lang', sel.value); } catch {}
      location.reload();
    };
  }
  // Etiquetas "Canal N →" del formulario Shure
  document.querySelectorAll('.shch').forEach((el) => { el.textContent = t('sh.ch', { n: el.dataset.n }); });

  // --- Punto de medida de los canales de entrada (lo guarda el ordenador puente)
  function onMeterPoint(m) {
    $('mpRow').hidden = !m.supported;
    meterPoint = m.supported ? m.value : null;
    $('optMp').value = m.value;
    refreshGroupHeads();
  }
  $('optMp').onchange = () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'meter-point', value: $('optMp').value }));
  };

  // Mantener la pantalla encendida si el navegador lo permite (solo en https o localhost).
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', keepAwake);

  let toastTimer;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
})();
</script>
</body>
</html>
